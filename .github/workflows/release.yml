name: Linux release draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to update, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux-packages:
    runs-on: ubuntu-24.04
    environment: release-signing
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate tag and export source identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a stable version tag like v0.1.0."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Verify selected draft for a manual rebuild
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo "::error::The selected release must already exist as a draft."
            exit 1
          fi
      - name: Check out the selected release source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Record exact checked-out source commit
        id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate app version and signing environment
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          app_version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match Tauri app version $app_version."
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || -z "$TAURI_UPDATER_PUBLIC_KEY" ]]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD as release-signing environment secrets and TAURI_UPDATER_PUBLIC_KEY as an environment variable."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned master commit; toolchain fixed below
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config squashfs-tools
      - name: Install frontend dependencies
        run: npm ci
      - name: Build, optimize, sign, and package x86_64 release assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          npm run build:desktop
          image=$(find src-tauri/target/build-linux/release/bundle/appimage -maxdepth 1 -type f -name '*_amd64.AppImage' -print -quit)
          bash scripts/optimize-appimage.sh "$image"
          CARGO_TARGET_DIR=src-tauri/target/build-linux bash scripts/assert-linux-bundles.sh
          if [[ -f "$image.sig" ]]; then unlink "$image.sig"; fi
          app_version="${RELEASE_TAG#v}"
          npm run tauri -- signer sign --app-version "$app_version" "$image"
          test -s "$image.sig"

          deb=$(find src-tauri/target/build-linux/release/bundle/deb -maxdepth 1 -type f -name '*_amd64.deb' -print -quit)
          mkdir -p release-assets
          deb_name=$(basename "$deb" | tr ' ' '.')
          image_name=$(basename "$image" | tr ' ' '.')
          cp "$deb" "release-assets/$deb_name"
          cp "$image" "release-assets/$image_name"
          cp "$image.sig" "release-assets/$image_name.sig"
          python3 scripts/create_updater_manifest.py \
            --version "$app_version" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --appimage "$image_name" --signature "release-assets/$image_name.sig" \
            --output release-assets/latest.json
          (
            cd release-assets
            sha256sum -- *.deb *.AppImage *.AppImage.sig latest.json > SHA256SUMS
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-amd64-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  stage-draft:
    needs: build-linux-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-amd64-release-assets
          path: release-assets
      - name: Verify downloaded package checksums, architecture, and updater manifest
        env:
          RELEASE_TAG: ${{ needs.build-linux-packages.outputs.release_tag }}
        run: |
          (
            cd release-assets
            sha256sum --check SHA256SUMS
          )
          shopt -s nullglob
          debs=(release-assets/*_amd64.deb)
          images=(release-assets/*_amd64.AppImage)
          signatures=(release-assets/*_amd64.AppImage.sig)
          if [[ ${#debs[@]} -ne 1 || ${#images[@]} -ne 1 || ${#signatures[@]} -ne 1 || ! -s release-assets/latest.json ]]; then
            echo "::error::Expected one amd64 .deb, AppImage, AppImage signature, and latest.json."
            exit 1
          fi
          [[ "$(dpkg-deb -f "${debs[0]}" Architecture)" == "amd64" ]] || {
            echo "::error::Debian package architecture is not amd64."
            exit 1
          }
          file "${images[0]}" | grep -Eq 'x86-64|x86_64' || {
            echo "::error::AppImage does not contain an x86_64 executable."
            exit 1
          }
          python3 - "${images[0]}" "${signatures[0]}" "$RELEASE_TAG" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          image = Path(sys.argv[1])
          signature = Path(sys.argv[2]).read_text(encoding="ascii").strip()
          tag = sys.argv[3]
          manifest = json.loads(Path("release-assets/latest.json").read_text(encoding="utf-8"))
          platform = manifest["platforms"]["linux-x86_64-appimage"]
          assert manifest["version"] == tag.removeprefix("v"), "manifest version does not match release tag"
          assert platform["signature"] == signature, "manifest signature differs from published sidecar"
          assert platform["url"].endswith("/" + image.name), "manifest URL does not point at the packaged AppImage"
          base64.b64decode(signature, validate=True)
          PY
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-linux-packages.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.build-linux-packages.outputs.source_sha }}
        run: |
          cat > release-notes.md <<'NOTES'
          The AppImage is signed and can be installed from the app’s Updates page after you choose **Install & restart**. Debian packages remain a manual Software/APT install.
          Installs from earlier versions, including v0.1.1, must install an updater-enabled AppImage manually once; later signed AppImage releases can be installed in-app.
          Both formats require host WebKitGTK 4.1 and GTK 3 libraries (`libwebkit2gtk-4.1-0` and `libgtk-3-0`). The AppImage does not bundle these libraries. Compatibility with older Linux bases is not guaranteed because glibc compatibility depends on the build baseline.
          `SHA256SUMS` covers the installers, updater signature, and `latest.json`; GitHub build-provenance attestations are attached to the package digests. Android SDK/Studio setup remains a guided, separate user action.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "::error::Refusing to replace assets on a published release."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Zorin DevStart $RELEASE_TAG" --notes-file release-notes.md --draft
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "Zorin DevStart $RELEASE_TAG" \
              --notes-file release-notes.md --target "$SOURCE_SHA"
          fi
          assets=(release-assets/*.deb release-assets/*.AppImage release-assets/*.AppImage.sig release-assets/latest.json release-assets/SHA256SUMS)
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Attest package checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
