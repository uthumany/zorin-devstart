name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned master commit; toolchain fixed below
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Install frontend dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Check packaging script syntax
        run: bash -n scripts/build-linux.sh scripts/assert-linux-bundles.sh scripts/optimize-appimage.sh
      - name: Test updater manifest generation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Run Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Compile x86_64 desktop app
        run: npm run tauri -- build --no-bundle
